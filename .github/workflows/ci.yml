name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python, tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/app
      RSFX_BIND_HOST: 127.0.0.1
      RSFX_PORT: "5055"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Installer executable mode and syntax
        run: |
          test "$(git ls-files --stage retrostation_fx_linux.sh | cut -d ' ' -f 1)" = "100755"
          bash -n retrostation_fx_linux.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Configure isolated state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/rsfx-validation.XXXXXX")"
          mkdir -p "$state/graphics"
          echo "RSFX_DATABASE=$state/rsfx.db" >> "$GITHUB_ENV"
          echo "RSFX_ETV_SCRIPT_DIR=$state/graphics" >> "$GITHUB_ENV"
      - name: Install locked runtime and check tools
        run: |
          python -m pip install --require-hashes -r app/requirements.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Syntax and import validation
        run: |
          python -m compileall -q app tests tools
          python -c 'import rsfx.app, rsfx.renderer, rsfx.timeline, rsfx.trigger'
          bash -n verify.sh
      - name: Correctness lint
        run: python -m ruff check --select E9,F63,F7,F82 app tests tools
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Isolated runtime selftest
        run: |
          mkdir -p "$(dirname "$RSFX_DATABASE")" "$RSFX_ETV_SCRIPT_DIR"
          python app/tools/selftest.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Audit every pinned runtime dependency
        run: |
          mkdir -p security-results
          python -m pip_audit --strict --disable-pip --no-deps -r app/requirements.lock \
            --format json --output security-results/runtime-dependencies.json
      - name: Audit CI tools and their installed dependencies
        if: always()
        run: |
          mkdir -p security-results
          python -m pip_audit --strict \
            --format json --output security-results/ci-dependencies.json
      - name: Retain dependency scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsfx-dependency-audit-${{ github.run_id }}
          path: security-results/*.json
          if-no-files-found: error
          retention-days: 30
