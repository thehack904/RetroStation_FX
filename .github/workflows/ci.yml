name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python, tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/app
      RSFX_BIND_HOST: 127.0.0.1
      RSFX_PORT: "5055"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer executable mode and syntax
        run: |
          test "$(git ls-files --stage retrostation_fx_linux.sh | cut -d ' ' -f 1)" = "100755"
          bash -n retrostation_fx_linux.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Configure isolated state
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/rsfx-validation.XXXXXX")"
          mkdir -p "$state/graphics"
          echo "RSFX_DATABASE=$state/rsfx.db" >> "$GITHUB_ENV"
          echo "RSFX_ETV_SCRIPT_DIR=$state/graphics" >> "$GITHUB_ENV"
      - name: Install locked runtime and check tools
        run: |
          python -m pip install --require-hashes -r app/requirements.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Syntax and import validation
        run: |
          python -m compileall -q app tests tools
          python -c 'import rsfx.app, rsfx.renderer, rsfx.timeline, rsfx.trigger'
          bash -n verify.sh
      - name: Correctness lint
        run: python -m ruff check --select E9,F63,F7,F82 app tests tools
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Isolated runtime selftest
        run: |
          mkdir -p "$(dirname "$RSFX_DATABASE")" "$RSFX_ETV_SCRIPT_DIR"
          python app/tools/selftest.py

      - name: Build verified sanitized release candidate
        if: ${{ github.ref_name == 'feature/v0.1.1-release' || github.base_ref == 'feature/v0.1.1-release' }}
        run: |
          mkdir -p release-candidate
          python tools/build_release_archive.py \
            --output release-candidate/RetroStation_FX-v0.1.1-rc.zip
      - name: Retain verified release candidate ZIP
        if: ${{ github.ref_name == 'feature/v0.1.1-release' || github.base_ref == 'feature/v0.1.1-release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsfx-v0.1.1-release-candidate-${{ github.run_id }}
          path: release-candidate/RetroStation_FX-v0.1.1-rc.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate actual Pillow Holiday Broadcast visual samples
        if: ${{ contains(github.head_ref || github.ref_name, 'holiday') }}
        run: |
          python app/tools/render_holiday_previews.py --output holiday-previews
      - name: Retain Holiday Broadcast visual acceptance samples
        if: ${{ contains(github.head_ref || github.ref_name, 'holiday') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsfx-holiday-visual-preview-${{ github.run_id }}
          path: holiday-previews/*.png
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Audit every pinned runtime dependency
        run: |
          mkdir -p security-results
          python -m pip_audit --strict --disable-pip --no-deps -r app/requirements.lock \
            --format json --output security-results/runtime-dependencies.json
      - name: Audit CI tools and their installed dependencies
        if: always()
        run: |
          mkdir -p security-results
          python -m pip_audit --strict \
            --format json --output security-results/ci-dependencies.json
      - name: Retain dependency scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsfx-dependency-audit-${{ github.run_id }}
          path: security-results/*.json
          if-no-files-found: error
          retention-days: 30
