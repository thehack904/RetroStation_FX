name: RSFX Security Scans

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feature/v0.1.0-reusable-styles
      - main
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install 'bandit==1.8.6'
      - name: Analyze Python source and installer helpers
        run: |
          mkdir -p security-results
          bandit -r app/rsfx app/adapter app/tools tools -f json -o security-results/bandit.json --severity-level low --confidence-level low --exit-zero
          bandit -r app/rsfx app/adapter app/tools tools --severity-level high --confidence-level high
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsfx-bandit-${{ github.run_id }}
          path: security-results/bandit.json
          if-no-files-found: error
          retention-days: 30

  semgrep:
    name: Semgrep Python and shell SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install 'semgrep==1.180.0'
      - name: Scan Python and detect incomplete scanner coverage
        shell: bash
        run: |
          mkdir -p security-results
          set +e
          semgrep scan --config p/python --error --json --output security-results/semgrep.json app tools
          scan_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("security-results/semgrep.json")
          if not report.exists():
              raise SystemExit("Semgrep did not generate a report")
          payload = json.loads(report.read_text())
          errors = payload.get("errors", [])
          print("Semgrep findings:", len(payload.get("results", [])))
          print("Semgrep scanner errors:", len(errors))
          for item in errors:
              print(str(item.get("message", ""))[:1000])
          if errors:
              raise SystemExit("Semgrep scan coverage incomplete")
          PY
          exit "$scan_status"
      - name: Validate installer and verification Bash scripts
        if: always()
        shell: bash
        run: |
          bash -n retrostation_fx_linux.sh verify.sh
          shellcheck -S error retrostation_fx_linux.sh verify.sh
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsfx-semgrep-${{ github.run_id }}
          path: security-results/semgrep.json
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Trivy filesystem, dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: json
          output: trivy-results.json
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsfx-trivy-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 30

  gitleaks:
    name: Gitleaks secret detection
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
